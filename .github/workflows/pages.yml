# Publishes the public website (GitHub Pages) after every survey run.
# Only aggregate numbers are published (see tools/build_dashboard.py); the repository itself stays private.
name: Publish website

on:
  workflow_run:                    # after each daily survey run
    workflows: ["Daily SCE survey"]
    types: [completed]
  push:                            # when the website code changes
    branches: [alizarif]
    paths: ["site/**", "tools/build_dashboard.py", "tools/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:               # "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alizarif            # the latest data, including the survey run's own commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build data and site
        run: |
          python tools/build_dashboard.py
          python tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
